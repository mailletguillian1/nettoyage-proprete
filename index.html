<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102b46"><meta name="description" content="Gestion de NETTOYAGE PROPRETÉ : clients, devis, factures, interventions et dépenses."><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon-192.png"><title>NETTOYAGE PROPRETÉ — Gestion</title><style>
:root{--navy:#102b46;--teal:#12b8b0;--pale:#dff8f5;--bg:#f3f6f9;--ink:#172b3a;--muted:#667887;--line:#e2e9ee;--red:#b94343;--green:#16845b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui, sans-serif}header{background:linear-gradient(120deg,#102b46,#1b4868);color:white;padding:20px 4%;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand{display:flex;gap:12px;align-items:center}.logo{background:var(--teal);color:var(--navy);border-radius:13px;padding:10px 14px;font-size:25px;font-weight:900}h1{font-size:18px;margin:0}.tag{font-size:12px;color:#d5e8ee}.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 80px)}nav{background:white;padding:15px 10px;border-right:1px solid var(--line)}nav button{display:block;width:100%;text-align:left;border:0;background:none;padding:12px;border-radius:9px;color:#536979;font-weight:700;cursor:pointer}nav button.active,nav button:hover{background:var(--pale);color:var(--navy)}main{padding:26px;max-width:1300px;width:100%;margin:auto}h2{color:var(--navy);margin:0;font-size:25px}.sub{color:var(--muted);font-size:13px;margin:4px 0 20px}.head{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.btn{border:0;border-radius:8px;padding:10px 14px;background:var(--teal);color:#073d40;font-weight:800;cursor:pointer}.alt{background:white;border:1px solid var(--line);color:var(--navy)}.danger{color:var(--red)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:15px 0}.card,.panel{background:white;border:1px solid var(--line);border-radius:13px;padding:16px;margin-bottom:15px;box-shadow:0 5px 20px #102b460b}.label{color:var(--muted);font-size:12px;font-weight:700}.num{font-size:25px;font-weight:850;color:var(--navy);margin:6px 0}.note{font-size:11px;color:#82919b}.panel h3{margin:0 0 12px;color:var(--navy)}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}th{font-size:11px;color:#738391;text-transform:uppercase}.empty{text-align:center;color:#84939e;padding:22px}.scroll{overflow:auto}.form{display:grid;grid-template-columns:1fr 1fr;gap:11px}.field{display:flex;flex-direction:column;gap:5px}.full{grid-column:1/-1}label{font-size:12px;font-weight:750;color:#526879}input,select,textarea{padding:10px;border:1px solid #d7e0e6;border-radius:8px;font:inherit;width:100%}textarea{min-height:65px}.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.pill{background:#edf3f7;border-radius:99px;padding:4px 8px;font-size:11px;font-weight:800}.green{background:#e2f5eb;color:#14704b}.orange{background:#fff3d8;color:#8a6410}.warn{background:#fff8df;border:1px solid #f1df9f;border-radius:9px;padding:12px;font-size:12px;color:#6d5714;margin:12px 0}footer{text-align:center;color:#8997a0;font-size:11px;padding:18px}@media(max-width:800px){.layout{grid-template-columns:1fr}nav{display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--line)}nav button{white-space:nowrap;width:auto}.grid{grid-template-columns:1fr 1fr}main{padding:15px}}@media(max-width:520px){.form{grid-template-columns:1fr}.full{grid-column:auto}.grid{gap:8px}.num{font-size:20px}}
</style><link rel="manifest" href="./manifest.json"></head><body><header><div class="brand"><div class="logo">✦</div><div><h1>NETTOYAGE PROPRETÉ</h1><div class="tag">INTÉRIEUR / EXTÉRIEUR · Votre espace propre, notre engagement</div></div></div><div class="tag">GESTION D'ENTREPRISE · Saint-Ghislain + 30 km</div></header><div class="layout"><nav><button class="active" data-p="dashboard">▦ Tableau de bord</button><button data-p="clients">♙ Clients</button><button data-p="quotes">▤ Devis</button><button data-p="invoices">▧ Factures</button><button data-p="jobs">▦ Interventions</button><button data-p="expenses">€ Dépenses</button><button data-p="settings">⚙ Sauvegarde</button></nav><main id="app"></main></div><footer>Version 1 · Données enregistrées localement dans ce navigateur · Exportez régulièrement une sauvegarde.</footer>
<script>
const K='np_app_v1';let db;try{db=JSON.parse(localStorage.getItem(K))||{clients:[],quotes:[],invoices:[],jobs:[],expenses:[],business:{}}}catch(e){db={clients:[],quotes:[],invoices:[],jobs:[],expenses:[],business:{}}}function save(){localStorage.setItem(K,JSON.stringify(db))}function id(p){return p+'-'+Date.now()}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function euro(n){return (Number(n)||0).toLocaleString('fr-BE',{style:'currency',currency:'EUR'})}function dfr(s){return s?new Date(s+'T12:00:00').toLocaleDateString('fr-BE'):'—'}function client(id){return db.clients.find(c=>c.id===id)?.name||'—'}function pill(s){return `<span class="pill ${s==='Payée'||s==='Accepté'||s==='Terminée'?'green':s==='Planifiée'||s==='Envoyé'?'orange':''}">${esc(s||'Brouillon')}</span>`}function table(head,rows){return `<div class="scroll"><table><thead><tr>${head.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td class="empty" colspan="${head.length}">Aucune donnée pour le moment.</td></tr>`}</tbody></table></div>`}function sectionHeader(title,desc,button=''){return `<div class="head"><div><h2>${title}</h2><div class="sub">${desc}</div></div>${button}</div>`}function metric(t,v,n){return `<div class="card"><div class="label">${t}</div><div class="num">${v}</div><div class="note">${n}</div></div>`}function go(p){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.p===p));render(p)}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.p));function render(p='dashboard'){let a=document.getElementById('app');a.innerHTML=({dashboard,clients,quotes,invoices,jobs,expenses,settings}[p])()}
function dashboard(){let paid=db.invoices.filter(x=>x.status==='Payée').reduce((s,x)=>s+x.amount,0),unpaid=db.invoices.filter(x=>x.status!=='Payée').reduce((s,x)=>s+x.amount,0),cost=db.expenses.reduce((s,x)=>s+x.amount,0);let upcoming=db.jobs.filter(x=>x.date>=new Date().toISOString().slice(0,10)).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,6);return sectionHeader('Tableau de bord','Vue d’ensemble de votre activité')+`<div class="warn">Bienvenue dans votre outil de gestion. Ajoutez d'abord vos clients, puis créez devis, factures et interventions. Les données sont sauvegardées sur cet appareil.</div><div class="grid">${metric('Clients',db.clients.length,'Fiches enregistrées')}${metric('Montant encaissé',euro(paid),'Factures marquées payées')}${metric('À encaisser',euro(unpaid),'Factures non payées')}${metric('Dépenses saisies',euro(cost),'Total enregistré')}</div><section class="panel"><h3>Prochaines interventions</h3>${table(['Date','Client','Prestation','Statut'],upcoming.map(x=>`<tr><td>${dfr(x.date)}</td><td>${esc(client(x.cid))}</td><td>${esc(x.service)}</td><td>${pill(x.status)}</td></tr>`).join(''))}</section><section class="panel"><h3>Accès rapide</h3><div class="actions"><button class="btn" onclick="go('clients')">+ Client</button><button class="btn alt" onclick="go('quotes')">+ Devis</button><button class="btn alt" onclick="go('jobs')">+ Intervention</button><button class="btn alt" onclick="go('expenses')">+ Dépense</button></div></section>`}
function clients(){return sectionHeader('Clients','Fichier clients et prospects','<button class="btn" onclick="clientForm()">+ Nouveau client</button>')+`<section class="panel">${table(['Nom','Type','Téléphone','E-mail','Localité','Actions'],db.clients.map(c=>`<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.type)}</td><td>${esc(c.phone)}</td><td>${esc(c.email)}</td><td>${esc(c.city)}</td><td><button class="btn alt" onclick="clientForm('${c.id}')">Modifier</button> <button class="btn alt danger" onclick="del('clients','${c.id}')">Supprimer</button></td></tr>`).join(''))}</section><div id="editor"></div>`}
function clientForm(cid=''){let c=db.clients.find(x=>x.id===cid)||{};editor(`<h3>${cid?'Modifier':'Ajouter'} un client</h3><form onsubmit="saveClient(event,'${cid}')"><div class="form"><div class="field"><label>Nom / entreprise *</label><input name="name" required value="${esc(c.name)}"></div><div class="field"><label>Type</label><select name="type"><option ${c.type==='Particulier'?'selected':''}>Particulier</option><option ${c.type==='Professionnel'?'selected':''}>Professionnel</option></select></div><div class="field"><label>Téléphone</label><input name="phone" value="${esc(c.phone)}"></div><div class="field"><label>E-mail</label><input name="email" type="email" value="${esc(c.email)}"></div><div class="field"><label>Adresse</label><input name="address" value="${esc(c.address)}"></div><div class="field"><label>Code postal / localité</label><input name="city" value="${esc(c.city)}"></div><div class="field full"><label>Notes</label><textarea name="notes">${esc(c.notes)}</textarea></div></div><div class="actions"><button class="btn">Enregistrer</button><button type="button" class="btn alt" onclick="render('clients')">Annuler</button></div></form>`)}function saveClient(e,cid){e.preventDefault();let x=Object.fromEntries(new FormData(e.target));if(cid)Object.assign(db.clients.find(c=>c.id===cid),x);else db.clients.push({id:id('CLI'),...x});save();render('clients')}
function opts(sel=''){return '<option value="">Choisir un client</option>'+db.clients.map(c=>`<option value="${c.id}" ${sel===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}function editor(s){document.getElementById('editor').innerHTML=`<section class="panel">${s}</section>`;document.getElementById('editor').scrollIntoView({behavior:'smooth'})}
function quotes(){return sectionHeader('Devis','Préparer et suivre les propositions commerciales','<button class="btn" onclick="quoteForm()">+ Nouveau devis</button>')+`<section class="panel">${table(['Référence','Date','Client','Description','Total','Statut','Action'],db.quotes.map(q=>`<tr><td>${q.ref}</td><td>${dfr(q.date)}</td><td>${esc(client(q.cid))}</td><td>${esc(q.desc)}</td><td>${euro(q.total)}</td><td>${pill(q.status)}</td><td><button class="btn alt" onclick="printDoc('quote','${q.id}')">Imprimer</button> <button class="btn alt" onclick="quoteStatus('${q.id}')">Statut</button></td></tr>`).join(''))}</section><div id="editor"></div>`}function quoteForm(){if(!db.clients.length){alert('Ajoutez d’abord un client.');go('clients');return}editor(`<h3>Nouveau devis</h3><form onsubmit="saveQuote(event)"><div class="form"><div class="field"><label>Client *</label><select name="cid" required>${opts()}</select></div><div class="field"><label>Date</label><input type="date" name="date" value="${new Date().toISOString().slice(0,10)}" required></div><div class="field"><label>Description *</label><input name="desc" required placeholder="Nettoyage terrasse…"></div><div class="field"><label>Quantité</label><input name="qty" type="number" min=".01" step=".25" value="1" required></div><div class="field"><label>Prix unitaire (€)</label><input name="unit" type="number" min="0" step=".01" value="35" required></div><div class="field"><label>Frais / produits (€)</label><input name="extra" type="number" min="0" step=".01" value="0"></div><div class="field"><label>Remise (€)</label><input name="discount" type="number" min="0" step=".01" value="0"></div><div class="field"><label>Notes / conditions</label><input name="notes"></div></div><div class="warn">35 €/unité est un exemple modifiable, pas un tarif conseillé. TVA non calculée dans cette version.</div><div class="actions"><button class="btn">Enregistrer le devis</button><button type="button" class="btn alt" onclick="render('quotes')">Annuler</button></div></form>`)}function saveQuote(e){e.preventDefault();let x=Object.fromEntries(new FormData(e.target));x.total=Math.max(0,Number(x.qty)*Number(x.unit)+Number(x.extra)-Number(x.discount));x.id=id('DEV');x.ref='DEV-'+String(db.quotes.length+1).padStart(4,'0');x.status='Brouillon';db.quotes.push(x);save();render('quotes')}function quoteStatus(i){let q=db.quotes.find(x=>x.id===i),s=prompt('Statut : Brouillon, Envoyé, Accepté ou Refusé',q.status);if(s){q.status=s;save();render('quotes')}}
function invoices(){return sectionHeader('Factures','Registre de suivi et impression','<button class="btn" onclick="invoiceForm()">+ Nouvelle facture</button>')+`<section class="panel">${table(['Référence','Date','Client','Description','Montant','Statut','Actions'],db.invoices.map(x=>`<tr><td>${x.ref}</td><td>${dfr(x.date)}</td><td>${esc(client(x.cid))}</td><td>${esc(x.desc)}</td><td>${euro(x.amount)}</td><td>${pill(x.status)}</td><td><button class="btn alt" onclick="printDoc('invoice','${x.id}')">Imprimer</button> <button class="btn alt" onclick="togglePaid('${x.id}')">Paiement</button></td></tr>`).join(''))}</section><div id="editor"></div>`}function invoiceForm(){if(!db.clients.length){alert('Ajoutez d’abord un client.');go('clients');return}editor(`<h3>Nouvelle facture / note de suivi</h3><form onsubmit="saveInvoice(event)"><div class="form"><div class="field"><label>Client *</label><select name="cid" required>${opts()}</select></div><div class="field"><label>Date</label><input type="date" name="date" value="${new Date().toISOString().slice(0,10)}" required></div><div class="field"><label>Description *</label><input name="desc" required></div><div class="field"><label>Montant total (€) *</label><input name="amount" type="number" min="0" step=".01" required></div><div class="field"><label>Échéance</label><input type="date" name="due"></div><div class="field"><label>Statut</label><select name="status"><option>À payer</option><option>Payée</option></select></div></div><div class="warn">Attention : ce module produit un registre et un document imprimable de préparation, pas une facture certifiée conforme. Vérifier les obligations belges, la TVA, la numérotation et la facturation électronique applicable avant utilisation officielle.</div><div class="actions"><button class="btn">Enregistrer</button><button type="button" class="btn alt" onclick="render('invoices')">Annuler</button></div></form>`)}function saveInvoice(e){e.preventDefault();let x=Object.fromEntries(new FormData(e.target));x.amount=Number(x.amount);x.id=id('FAC');x.ref='FAC-'+String(db.invoices.length+1).padStart(4,'0');db.invoices.push(x);save();render('invoices')}function togglePaid(i){let x=db.invoices.find(x=>x.id===i);x.status=x.status==='Payée'?'À payer':'Payée';save();render('invoices')}
function jobs(){return sectionHeader('Interventions','Planning des prestations','<button class="btn" onclick="jobForm()">+ Planifier</button>')+`<section class="panel">${table(['Date','Heure','Client','Prestation','Durée','Statut','Action'],db.jobs.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(x=>`<tr><td>${dfr(x.date)}</td><td>${esc(x.time)}</td><td>${esc(client(x.cid))}</td><td>${esc(x.service)}</td><td>${esc(x.duration)}</td><td>${pill(x.status)}</td><td><button class="btn alt" onclick="jobStatus('${x.id}')">Statut</button> <button class="btn alt danger" onclick="del('jobs','${x.id}')">Supprimer</button></td></tr>`).join(''))}</section><div id="editor"></div>`}function jobForm(){if(!db.clients.length){alert('Ajoutez d’abord un client.');go('clients');return}editor(`<h3>Planifier une intervention</h3><form onsubmit="saveJob(event)"><div class="form"><div class="field"><label>Client *</label><select name="cid" required>${opts()}</select></div><div class="field"><label>Date *</label><input type="date" name="date" required value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Heure</label><input type="time" name="time"></div><div class="field"><label>Prestation</label><select name="service"><option>Nettoyage terrasse</option><option>Nettoyage garage</option><option>Nettoyage cave</option><option>Nettoyage sols</option><option>Nettoyage vitres</option><option>Nettoyage professionnel</option><option>Autre</option></select></div><div class="field"><label>Durée estimée</label><input name="duration" placeholder="Ex. 2 heures"></div><div class="field"><label>Statut</label><select name="status"><option>Planifiée</option><option>Terminée</option><option>Annulée</option></select></div><div class="field full"><label>Adresse / consignes</label><textarea name="notes"></textarea></div></div><div class="actions"><button class="btn">Enregistrer</button></div></form>`)}function saveJob(e){e.preventDefault();db.jobs.push({id:id('INT'),...Object.fromEntries(new FormData(e.target))});save();render('jobs')}function jobStatus(i){let x=db.jobs.find(x=>x.id===i),s=prompt('Statut : Planifiée, Terminée ou Annulée',x.status);if(s){x.status=s;save();render('jobs')}}
function expenses(){let sum=db.expenses.reduce((a,x)=>a+x.amount,0);return sectionHeader('Dépenses','Suivre les achats et frais professionnels','<button class="btn" onclick="expenseForm()">+ Ajouter</button>')+`<div class="grid">${metric('Total dépenses',euro(sum),'Dépenses enregistrées')}</div><section class="panel">${table(['Date','Catégorie','Description','Montant','Action'],db.expenses.map(x=>`<tr><td>${dfr(x.date)}</td><td>${esc(x.cat)}</td><td>${esc(x.desc)}</td><td>${euro(x.amount)}</td><td><button class="btn alt danger" onclick="del('expenses','${x.id}')">Supprimer</button></td></tr>`).join(''))}</section><div id="editor"></div>`}function expenseForm(){editor(`<h3>Nouvelle dépense</h3><form onsubmit="saveExpense(event)"><div class="form"><div class="field"><label>Date</label><input type="date" name="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Catégorie</label><select name="cat"><option>Matériel</option><option>Produits</option><option>Carburant / déplacement</option><option>Assurance</option><option>Communication</option><option>Frais administratifs</option><option>Autre</option></select></div><div class="field"><label>Description</label><input name="desc" required></div><div class="field"><label>Montant (€)</label><input name="amount" type="number" min="0" step=".01" required></div></div><div class="actions"><button class="btn">Enregistrer</button></div></form>`)}function saveExpense(e){e.preventDefault();let x=Object.fromEntries(new FormData(e.target));x.amount=Number(x.amount);x.id=id('DEP');db.expenses.push(x);save();render('expenses')}
function settings(){return sectionHeader('Sauvegarde & paramètres','Protéger et exporter les données')+`<section class="panel"><h3>Coordonnées de l’entreprise</h3><form onsubmit="saveBusiness(event)"><div class="form"><div class="field full"><label>Nom commercial</label><input name="name" value="${esc(db.business.name||'NETTOYAGE PROPRETÉ INTÉRIEUR / EXTÉRIEUR')}"></div><div class="field"><label>Téléphone</label><input name="phone" value="${esc(db.business.phone)}"></div><div class="field"><label>E-mail</label><input name="email" type="email" value="${esc(db.business.email)}"></div><div class="field"><label>Adresse</label><input name="address" value="${esc(db.business.address)}"></div><div class="field"><label>N° entreprise / TVA</label><input name="vat" value="${esc(db.business.vat)}"></div></div><div class="actions"><button class="btn">Enregistrer</button></div></form></section><section class="panel"><h3>Exporter / restaurer</h3><p class="sub">Téléchargez régulièrement une copie JSON. Le CSV peut être ouvert dans Excel ou LibreOffice.</p><div class="actions"><button class="btn" onclick="backup()">Télécharger sauvegarde JSON</button><button class="btn alt" onclick="csvExport()">Exporter CSV</button><label class="btn alt" style="cursor:pointer">Importer sauvegarde<input type="file" accept=".json,application/json,text/json" hidden onchange="restore(event)"></label></div></section><div class="warn">Cette application fonctionne localement dans le navigateur. Les données ne sont pas synchronisées entre appareils et ne sont pas envoyées sur un serveur. Prévoir une solution sécurisée et une validation comptable/juridique avant une exploitation commerciale réelle.</div>`}function saveBusiness(e){e.preventDefault();db.business=Object.fromEntries(new FormData(e.target));save();render('settings')}function del(bucket,i){if(confirm('Supprimer cet élément ?')){db[bucket]=db[bucket].filter(x=>x.id!==i);save();render()}}
function download(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function backup(){download(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),'nettoyage-proprete-sauvegarde.json')}function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.clients)||!Array.isArray(x.invoices))throw 0;if(confirm('Remplacer les données présentes par cette sauvegarde ?')){db=x;save();render('settings')}}catch(z){alert('Fichier invalide.')}};r.readAsText(f)}function csvExport(){let rows=[['Type','Date','Référence','Client','Description','Montant','Statut']];db.quotes.forEach(x=>rows.push(['Devis',x.date,x.ref,client(x.cid),x.desc,x.total,x.status]));db.invoices.forEach(x=>rows.push(['Facture',x.date,x.ref,client(x.cid),x.desc,x.amount,x.status]));db.expenses.forEach(x=>rows.push(['Dépense',x.date,'','',x.desc,x.amount,x.cat]));let csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\n');download(new Blob([csv],{type:'text/csv;charset=utf-8'}),'nettoyage-proprete-export.csv')}
function printDoc(kind,i){let x=(kind==='quote'?db.quotes:db.invoices).find(y=>y.id===i),b=db.business,c=db.clients.find(y=>y.id===x.cid)||{},quote=kind==='quote',amount=quote?x.total:x.amount;let w=window.open('','_blank');if(!w){alert('Autorisez les fenêtres contextuelles.');return}w.document.write(`<html lang="fr"><meta charset="utf-8"><title>${quote?'Devis':'Facture'} ${x.ref}</title><style>body{font:14px Arial;padding:40px;color:#183047}h1{color:#102b46}hr{border:0;border-top:3px solid #12b8b0;margin:24px 0}.right{text-align:right}table{width:100%;border-collapse:collapse;margin-top:35px}td,th{padding:12px;border-bottom:1px solid #ddd;text-align:left}.total{text-align:right;font-size:23px;font-weight:bold;margin-top:25px}.muted{color:#687b89;font-size:12px;margin-top:50px}</style><h1>${esc(b.name||'NETTOYAGE PROPRETÉ')}</h1>${esc(b.address||'')}<br>${esc(b.phone||'')} · ${esc(b.email||'')}<br>${esc(b.vat||'')}<hr><div class="right"><h2>${quote?'DEVIS':'FACTURE'} ${esc(x.ref)}</h2>Date : ${dfr(x.date)}</div><h3>Client</h3>${esc(c.name)}<br>${esc(c.address)}<br>${esc(c.city)}<br>${esc(c.email)}<br>${esc(c.phone)}<table><tr><th>Description</th><th>Montant</th></tr><tr><td>${esc(x.desc)}</td><td>${euro(amount)}</td></tr></table><div class="total">Total : ${euro(amount)}</div><p>${esc(x.notes||'')}</p><div class="muted">Document de préparation généré par l'outil local. Vérifier les mentions et obligations légales avant émission ou envoi.</div><script>window.onload=()=>window.print()<\/script></html>`);w.document.close()}
render();
</script><script>if("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")){window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js").catch(err=>console.warn("Service worker non enregistré",err)));}</script></body></html>
